plugins {
	id 'java'
	id 'application'
	id 'maven-publish'
	id 'jacoco'
}

group = 'net.shrimpworks'
version = "1.8"
if (System.getenv().containsKey("BUILD_NUMBER")) {
	version += ".${System.env.BUILD_NUMBER}"
} else version += ".DEV"

application {
	mainClass = 'net.shrimpworks.unreal.dependencies.Main'
	mainModule = 'shrimpworks.unreal.dependencies'
}

compileJava {
	options.release = 21
}

repositories {
	mavenLocal()
	mavenCentral()
	maven {
		url "https://git.pookaroo.au/api/packages/shrimp/maven"
		credentials(HttpHeaderCredentials) {
			name = "Authorization"
			value = "token ${providers.gradleProperty("packagesReadToken").get()}"
		}
		authentication {
			header(HttpHeaderAuthentication)
		}
	}
}

publishing {
	repositories {
		maven {
			name = "ShrimpWorks"
			url = 'https://git.pookaroo.au/api/packages/shrimp/maven'
			credentials(HttpHeaderCredentials) {
				name = "Authorization"
				value = "token ${System.env.PACKAGES_TOKEN}"
			}

			authentication {
				header(HttpHeaderAuthentication)
			}
		}
	}
	publications {
		maven(MavenPublication) {
			from components.java
		}
	}
}

dependencies {
	implementation('net.shrimpworks:unreal-package-lib:1.15.7')

	testImplementation('org.junit.jupiter:junit-jupiter:5.14.1')
	testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

jar {
	manifest {
		attributes(
				'Implementation-Title': project.name,
				'Implementation-Version': project.version,
				'Main-Class': application.mainClass,
		)
	}
}

test {
	useJUnitPlatform()
}

jacocoTestReport {
	reports {
		xml.required = true
	}
}
